name: Weekly maintenance

on:
  schedule:
    # Mondays at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-maintenance
  cancel-in-progress: false

jobs:
  dependency-status:
    name: Refresh dependency status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate dependency status
        run: node scripts/generate-deps-status.mjs

      - name: Summarize for Actions
        run: |
          {
            echo "## Dependency status check"
            echo ""
            echo "Generated \`docs/dependency-status.md\`."
            echo ""
            echo "Commits only when the file content changed"
            echo "(no empty churn commits)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit only if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/dependency-status.md

          if git diff --cached --quiet; then
            echo "No dependency status changes — skipping commit."
            exit 0
          fi

          git commit -m "chore: refresh dependency status report"
          git push
